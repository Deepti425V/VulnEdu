services:
  - type: web
    name: vulnedu
    env: python
    plan: free
    branch: main
    repo: https://github.com/yourusername/vulnedu.git  # ← replace with your real repo URL
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=2 --timeout=120 --bind 0.0.0.0:$PORT "vulnedu:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      # ⬇️ Disable database and API fetching on Render free plan
      - key: DATABASE_ENABLED
        value: false
      - key: USE_DATABASE_CACHE
        value: false
      - key: USE_LOCAL_FEEDS
        value: true
      - key: DISABLE_API_CLIENT
        value: true  # <— add this to prevent NVD API fetches
