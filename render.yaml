services:
  - type: web
    name: vulnedu
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "chmod +x startup.sh && ./startup.sh"
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: vulnedu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NVD_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MALLOC_TRIM_THRESHOLD_
        value: 100000
      - key: MALLOC_MMAP_THRESHOLD_
        value: 100000
      - key: WEB_CONCURRENCY
        value: 1
    
    autoDeploy: false
    
databases:
  - name: vulnedu-db
    plan: free
    databaseName: vulnedu
    user: vulnedu

# Health check configuration
healthCheckPath: /health