services:
  - type: web
    name: vulnedu
    env: python
    plan: free
    branch: main
    repo: https://github.com/yourusername/vulnedu.git  # ← replace with your repo URL
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=2 --timeout=120 vulnedu:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      # ⬇️ These three disable DB mode and use local data instead
      - key: DATABASE_ENABLED
        value: false
      - key: USE_DATABASE_CACHE
        value: false
      - key: USE_LOCAL_FEEDS
        value: true

# ⚠️ Remove the "databases:" section entirely unless you explicitly want Postgres.
