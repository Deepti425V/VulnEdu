services:
  # Web service for Flask application
  - type: web
    name: vulnedu
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 "vulnedu:create_app()"
    repo: https://github.com/yourusername/vulnedu.git # Replace with your GitHub repo
    plan: free
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vulnedu-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  # PostgreSQL database instance
  - name: vulnedu-db
    plan: free
    databaseName: vulnedu
    ipAllowList: []